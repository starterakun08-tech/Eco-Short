<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EcoSort IoT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo .icon-box {
      width: 54px;
      height: 54px;
      background: #546B41;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      margin-bottom: 0.85rem;
    }

    .logo .icon-box svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.3px;
    }

    .logo p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.35rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #475569;
      margin-bottom: 0.45rem;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      height: 44px;
      padding: 0 1rem;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      color: #1e293b;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: #546B41;
      box-shadow: 0 0 0 3px rgba(84, 107, 65, 0.2);
    }

    .btn {
      width: 100%;
      height: 44px;
      background: #546B41;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .btn:hover:not(:disabled) {
      background: #435634;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .error-msg {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1.25rem;
      display: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>EcoSort IoT</h1>
      <p>Dashboard Monitoring & Kontrol</p>
    </div>

    <div class="error-msg" id="error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Nama Pengguna</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Masuk</button>
    </form>
  </div>

  <script>
    if (localStorage.getItem('ecosort_token')) {
      window.location.href = '/';
    }

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Username atau password salah');
        }

        localStorage.setItem('ecosort_token', data.token);
        localStorage.setItem('ecosort_user', data.username);
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
