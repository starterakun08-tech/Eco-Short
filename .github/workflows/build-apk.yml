name: Build EcoSort CCTV APK

on:
  push:
    paths:
      - 'cctv_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Scaffold & Dependencies
        working-directory: cctv_app
        run: |
          # 1. Simpan AndroidManifest.xml (yang berisi permission Kamera & Jaringan)
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true

          # 2. Re-create android platform agar Gradle & Kotlin 100% kompatibel dengan Flutter
          rm -rf android
          flutter create . --platforms=android --org com.ecosort

          # 3. Pulihkan AndroidManifest.xml dengan izin kamera & cleartext traffic
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # 4. Set minSdk ke 21 (diwajibkan oleh plugin camera Flutter)
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +

          # 5. Atur JVM args aman untuk GitHub Actions runner (3GB RAM)
          echo "org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G" >> android/gradle.properties

          # 6. Unduh dependensi
          flutter pub get

      - name: Build Release APK
        working-directory: cctv_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcoSort-CCTV-Release-APK
          path: cctv_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: EcoSort CCTV App (Latest Release APK)
          body: |
            ## 📱 EcoSort CCTV - Smart Camera App
            Aplikasi CCTV Cerdas Pemantau Kebersihan Sekitar Tong Sampah EcoSort IoT.
            
            **Cara Pasang di HP Android:**
            1. Unduh file **`app-release.apk`** di bawah ini.
            2. Buka file APK di HP Android dan izinkan instalasi dari sumber ini.
          files: cctv_app/build/app/outputs/flutter-apk/app-release.apk
