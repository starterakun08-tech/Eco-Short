name: Build EcoSort CCTV APK

on:
  push:
    paths:
      - 'cctv_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: cctv_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: cctv_app
        run: |
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee ../build.log || {
            echo "::error::Gradle build failed"
            tail -n 80 ../build.log
            exit 1
          }

      - name: Collect Output APK
        run: |
          echo "=== LOG TERAKHIR FLUTTER BUILD ==="
          tail -n 30 build.log

          # Ambil path file APK yang dicetak langsung oleh Flutter
          APK_PATH=$(grep -oE "[^ ]*build/[^ ]*\.apk" build.log | tail -n 1 || true)
          echo "Path terdeteksi dari log: '$APK_PATH'"

          if [ -n "$APK_PATH" ] && [ -f "cctv_app/$APK_PATH" ]; then
            cp -v "cctv_app/$APK_PATH" ./app-release.apk
          elif [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp -v "$APK_PATH" ./app-release.apk
          else
            echo "Mencari dengan find..."
            find . -type f -name "*.apk" -exec cp -v {} ./app-release.apk \; || true
            find /home/runner/work -type f -name "*.apk" -exec cp -v {} ./app-release.apk \; || true
          fi

          ls -lh ./app-release.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcoSort-CCTV-Release-APK
          path: app-release.apk
          if-no-files-found: error

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: EcoSort CCTV App (Latest Release APK)
          body: |
            ## 📱 EcoSort CCTV - Smart Camera App
            Aplikasi CCTV Cerdas Pemantau Kebersihan Sekitar Tong Sampah EcoSort IoT.
            
            **Cara Pasang di HP Android:**
            1. Unduh file **`app-release.apk`** di bawah ini.
            2. Buka file APK di HP Android dan izinkan instalasi dari sumber ini.
          files: app-release.apk
