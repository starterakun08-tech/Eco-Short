name: Build EcoSort CCTV APK

on:
  push:
    paths:
      - 'cctv_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android platform scaffold
        working-directory: cctv_app
        run: |
          # Teman hanya commit AndroidManifest.xml, kita lengkapi gradle scaffold-nya
          flutter create . --platforms=android --org com.ecosort
          flutter pub get

      - name: Build Release APK
        working-directory: cctv_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcoSort-CCTV-Release-APK
          path: cctv_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
