name: Build EcoSort CCTV APK

on:
  push:
    paths:
      - 'cctv_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: cctv_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: cctv_app
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee ../build.log || {
            ERR=$(tail -n 25 ../build.log | tr '\n' ' ' | sed 's/"//g')
            echo "::error title=GRADLE_ERROR::$ERR"
            exit 1
          }

          echo "=== PENCARIAN FILE APK ==="
          find /home/runner/work -name "*.apk" -ls
          find /home/runner/work -name "*.apk" -exec cp -v {} ../app-release.apk \;
          ls -lh ../app-release.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcoSort-CCTV-Release-APK
          path: app-release.apk
          if-no-files-found: error

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: EcoSort CCTV App (Latest Release APK)
          body: |
            ## 📱 EcoSort CCTV - Smart Camera App
            Aplikasi CCTV Cerdas Pemantau Kebersihan Sekitar Tong Sampah EcoSort IoT.
            
            **Cara Pasang di HP Android:**
            1. Unduh file **`app-release.apk`** di bawah ini.
            2. Buka file APK di HP Android dan izinkan instalasi dari sumber ini.
          files: app-release.apk
